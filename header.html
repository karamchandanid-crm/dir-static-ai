<header class="header">
    <div class="header__brand">
        <div class="header__logo">
            <svg viewBox="0 0 100 100" class="brand-logo">
                <circle cx="50" cy="50" r="45" fill="#1d9bf0" stroke="#fff" stroke-width="3"/>
                <path d="M35 40 L50 55 L65 40" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="50" cy="35" r="8" fill="#fff"/>
            </svg>
            <div class="brand-text">
                <span class="brand-name">Autodesk</span>
                <span class="brand-subtitle">Community Hub</span>
            </div>
        </div>
        <div class="header__actions">
            <button class="btn btn--secondary">Export Data</button>
            <button class="btn btn--primary">Join Community</button>
        </div>
    </div>
    <div class="header__content">
        <h1 class="header__title">Meet Our Community Leaders</h1>
        <p class="header__description">Discover exceptional professionals who are making a difference in their communities through innovation and expertise</p>
        <div class="header__stats">
            <div class="stat-badge">
                <span class="stat-number">8</span>
                <span class="stat-label">Leaders</span>
            </div>
            <div class="stat-badge">
                <span class="stat-number">8</span>
                <span class="stat-label">Countries</span>
            </div>
            <div class="stat-badge">
                <span class="stat-number">4</span>
                <span class="stat-label">Regions</span>
            </div>
        </div>
    </div>
</header>
