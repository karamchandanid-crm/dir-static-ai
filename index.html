<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Leaders - Trailhead Style</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="header__title">Meet Our Community Leaders</h1>
            <p class="header__description">Discover exceptional professionals who are making a difference in their communities</p>
        </header>

        <div class="filters">
            <div class="filters__search">
                <input type="text" id="searchInput" class="search-input" placeholder="Search Community Leaders...">
            </div>
            <div class="filters__options">
                <select id="regionFilter" class="filter-select add-on-hides">
                    <option value="">All Regions</option>
                    <option value="north-america">North America</option>
                    <option value="europe">Europe</option>
                    <option value="asia-pacific">Asia Pacific</option>
                    <option value="latin-america">Latin America</option>
                </select>
                <select id="expertiseFilter" class="filter-select add-on-hides">
                    <option value="">All Expertise</option>
                    <option value="development">Development</option>
                    <option value="administration">Administration</option>
                    <option value="architecture">Architecture</option>
                    <option value="consulting">Consulting</option>
                </select>
                <select id="industryFilter" class="filter-select">
                    <option value="">All Industries</option>
                    <option value="BIM Manager">BIM Manager</option>
                    <option value="BIM Consultant">BIM Consultant</option>
                    <option value="BIM Coordinator">BIM Coordinator</option>
                    <option value="Architect">Architect</option>
                    <option value="CAD Administrator">CAD Administrator</option>
                    <option value="Consultant">Consultant</option>
                    <option value="Software Engineer">Software Engineer</option>
                    <option value="Technical Specialist">Technical Specialist</option>
                </select>
                <select id="productFilter" class="filter-select">
                    <option value="">All Products</option>
                    <option value="3ds Max">3ds Max</option>
                    <option value="AutoCAD">AutoCAD</option>
                    <option value="AutoCAD Civil 3D">AutoCAD Civil 3D</option>
                    <option value="BIM 360 Design">BIM 360 Design</option>
                    <option value="BIM 360 Field">BIM 360 Field</option>
                    <option value="Fusion 360">Fusion 360</option>
                    <option value="Inventor">Inventor</option>
                    <option value="NavisWorks">NavisWorks</option>
                    <option value="Revit">Revit</option>
                    <option value="Vault">Vault</option>
                </select>
                <select id="yearFilter" class="filter-select">
                    <option value="">All Years</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                </select>
                <select id="alignmentToggle" class="filter-select">
                    <option value="alignment-1">Compact Card</option>
                    <option value="alignment-2">Detailed Card</option>
                    <option value="alignment-3">List View</option>
                    <option value="alignment-4">Grid Minimal</option>
                    <option value="alignment-5">Profile Focus</option>
                    <option value="alignment-6">LinkedIn Professional</option>
                    <option value="alignment-7">Facebook Social</option>
                    <option value="alignment-8">X (Twitter) Minimal</option>
                    <option value="alignment-9">YouTube Creator</option>
                    <option value="alignment-10">Salesforce Data</option>
                    <option value="alignment-11">Microsoft Fluent</option>
                    <option value="alignment-12">Apple Minimalist</option>
                </select>
            </div>
        </div>

        <div class="layout-controls">
            <div class="layout-controls__header">
                <h3 class="layout-controls__title">Layout View Options</h3>
            </div>
            <div class="layout-controls__section">
                <h4 class="layout-controls__subtitle">Card Layout Style</h4>
                <div class="layout-controls__radio-group">
                    <div class="layout-option">
                        <label class="layout-option__label">
                            <input type="radio" name="layoutStyle" value="alignment-1" class="layout-option__input">
                            <span class="layout-badge">1</span>
                            <span class="layout-option__text">Compact</span>
                            <span class="layout-option__description">Minimal centered cards</span>
                        </label>
                    </div>
                    <div class="layout-option">
                        <label class="layout-option__label">
                            <input type="radio" name="layoutStyle" value="alignment-2" class="layout-option__input" checked>
                            <span class="layout-badge">2</span>
                            <span class="layout-option__text">Detailed</span>
                            <span class="layout-option__description">Full stats display</span>
                        </label>
                    </div>
                    <div class="layout-option">
                        <label class="layout-option__label">
                            <input type="radio" name="layoutStyle" value="alignment-3" class="layout-option__input">
                            <span class="layout-badge">3</span>
                            <span class="layout-option__text">List</span>
                            <span class="layout-option__description">Horizontal rows</span>
                        </label>
                    </div>
                    <div class="layout-option">
                        <label class="layout-option__label">
                            <input type="radio" name="layoutStyle" value="alignment-4" class="layout-option__input">
                            <span class="layout-badge">4</span>
                            <span class="layout-option__text">Grid</span>
                            <span class="layout-option__description">Photo grid</span>
                        </label>
                    </div>
                    <div class="layout-option add-on-hides">
                        <label class="layout-option__label">
                            <input type="radio" name="layoutStyle" value="alignment-5" class="layout-option__input">
                            <span class="layout-badge">3</span>
                            <span class="layout-option__text">Focus</span>
                            <span class="layout-option__description">Cover images</span>
                        </label>
                    </div>
                    <div class="layout-option add-on-hides">
                        <label class="layout-option__label">
                            <input type="radio" name="layoutStyle" value="alignment-6" class="layout-option__input">
                            <span class="layout-badge layout-badge--brand" data-brand="in">in</span>
                            <span class="layout-option__text">LinkedIn</span>
                            <span class="layout-option__description">Professional</span>
                        </label>
                    </div>
                    <div class="layout-option">
                        <label class="layout-option__label">
                            <input type="radio" name="layoutStyle" value="alignment-7" class="layout-option__input">
                            <span class="layout-badge layout-badge--brand" data-brand="fb">f</span>
                            <span class="layout-option__text">Facebook</span>
                            <span class="layout-option__description">Social metrics</span>
                        </label>
                    </div>
                    <div class="layout-option">
                        <label class="layout-option__label">
                            <input type="radio" name="layoutStyle" value="alignment-8" class="layout-option__input">
                            <span class="layout-badge layout-badge--brand" data-brand="x">𝕏</span>
                            <span class="layout-option__text">Twitter/X</span>
                            <span class="layout-option__description">Compact</span>
                        </label>
                    </div>
                    <div class="layout-option">
                        <label class="layout-option__label">
                            <input type="radio" name="layoutStyle" value="alignment-9" class="layout-option__input">
                            <span class="layout-badge layout-badge--brand" data-brand="yt">▶</span>
                            <span class="layout-option__text">YouTube</span>
                            <span class="layout-option__description">Creator style</span>
                        </label>
                    </div>
                    <div class="layout-option">
                        <label class="layout-option__label">
                            <input type="radio" name="layoutStyle" value="alignment-10" class="layout-option__input">
                            <span class="layout-badge layout-badge--brand" data-brand="sf">☁</span>
                            <span class="layout-option__text">Salesforce</span>
                            <span class="layout-option__description">Data fields</span>
                        </label>
                    </div>
                    <div class="layout-option">
                        <label class="layout-option__label">
                            <input type="radio" name="layoutStyle" value="alignment-11" class="layout-option__input">
                            <span class="layout-badge layout-badge--brand" data-brand="ms">⊞</span>
                            <span class="layout-option__text">Microsoft</span>
                            <span class="layout-option__description">Fluent design</span>
                        </label>
                    </div>
                    <div class="layout-option">
                        <label class="layout-option__label">
                            <input type="radio" name="layoutStyle" value="alignment-12" class="layout-option__input">
                            <span class="layout-badge layout-badge--brand" data-brand="apple"></span>
                            <span class="layout-option__text">Apple</span>
                            <span class="layout-option__description">Minimalist</span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="layout-controls__section add-on-hides">
                <h4 class="layout-controls__subtitle">Stats Display Arrangement (for Detailed Card)</h4>
                <div class="layout-controls__radio-group">
                    <div class="layout-option">
                        <label class="layout-option__label">
                            <input type="radio" name="stateArrangement" value="side-by-side" class="layout-option__input" checked>
                            <span class="layout-option__text">Side-by-side State Arrangement</span>
                            <span class="layout-option__description">Display profile stats in two columns</span>
                        </label>
                    </div>
                    <div class="layout-option" style="display: none;">
                        <label class="layout-option__label">
                            <input type="radio" name="stateArrangement" value="by-line" class="layout-option__input">
                            <span class="layout-option__text">By-line State Arrangement</span>
                            <span class="layout-option__description">Display profile stats in single column rows</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="results-info">
            <span id="resultsCount" class="results-count">Loading profiles...</span>
        </div>

        <div id="profileGrid" class="profile-grid">
            <div class="loading">
                <div class="loading__spinner"></div>
                <p>Loading Community Leader profiles...</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
